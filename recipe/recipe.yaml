schema_version: 1

context:
  name: pyload-ng
  version: "0.5.0b3.dev102"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 023cc58c31bf1a69db36c3777aafe04c340b5e554968b51ea82a829dfd481055

build:
  noarch: python
  number: ${{ build_number }}
  #skip: ppc64le #mini-racer on ppc64le isn't avalaible for now
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  #string: ${{ pymin }}_pyh${{ hash }}_${{ build_number }}
  python:
    entry_points:
      - pyload = pyload.__main__:main

requirements:
  build:
    #- if: build_platform != target_platform
     # then: python
    #- if: build_platform != target_platform
    #  then: cross-python_${{ target_platform }}
    - babel
    - jinja2
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=38.3
    - wheel
    - packaging
  run:
    - python >=${{ python_min }}
    - aia-chaser >=3.6.0
    - cheroot
    - flask
    - flask-babel
    - flask-caching >=1.9,<2.dev0
    - flask-compress >=1.8,<2.dev0
    - Flask-Session >=0.8.0
    - flask-themes2 >=1.0,<2.dev0
    - flask-wtf
    - bitmath >=1.3,<2.dev0
    - cryptography >=35.0.0
    - defusedxml
    - filetype >=1.0,<2.dev0
    - mini-racer
    - packaging
    - pycurl >=7.45.7
    - pydantic
    - certifi
    - semver
    - setuptools >=38.3
    - pyfcm >=2.0.0

tests:
  - python:
      imports:
        - pyload
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
    #  - if: win
      #  then: set PYTHONIOENCODING=utf-8
      - pip check
      - pyload --help
      - pyload --version

about:
  summary: The free and open-source Download Manager written in pure Python
  license: AGPL-3.0-only
  license_file: LICENSE.md
  description: |
    *pyLoad* is a free and open source downloader for 1-click-hosting sites.
    It supports link decryption as well as all important container formats.
    Targeted for headless NASs it is designed to be extremely lightweight,
    fully customizable and remotely manageable via web interface.


  homepage: https://pyload.net
  repository: https://github.com/pyload/pyload
  documentation: https://github.com/pyload/pyload/wiki

extra:
  recipe-maintainers:
    - HeavyTony2
